name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  stable:
    name: Stable
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Validate Twitch surface tooling
        run: python3 -m py_compile tools/twitch_surface.py

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test default features
        run: cargo test --workspace --locked

      - name: Test all features
        run: cargo test --workspace --all-features --locked

      - name: Build docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features --locked

      - name: Verify packaging
        run: cargo package --workspace --locked

  wasm:
    name: Stable (wasm)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install stable toolchain with wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build Cloudflare Worker feature for wasm
        run: cargo build --features cloudflare-worker --target wasm32-unknown-unknown --locked

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail

          MSRV="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ -z "$MSRV" ]; then
            echo "Could not read rust-version from Cargo.toml." >&2
            exit 1
          fi
          echo "version=$MSRV" >> "$GITHUB_OUTPUT"

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Test all features on MSRV
        run: cargo test --workspace --all-features --locked

  reuse:
    name: REUSE
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check REUSE compliance
        uses: fsfe/reuse-action@v6
