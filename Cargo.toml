[workspace]
resolver = "3"
members = [
    ".",
    "barbed-core",
    "barbed-7tv",
    "barbed-bttv",
    "barbed-ffz",
]

[workspace.package]
version = "0.0.4-alpha.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["すごいジャン <me@sugoijan.dev>"]
repository = "https://github.com/sugoijan/barbed"
documentation = "https://docs.rs/barbed"

[workspace.dependencies]
# Internal crates: bumping a release edits `workspace.package.version` plus
# these four requirements, all in this file.
barbed-core = { path = "barbed-core", version = "0.0.4-alpha" }
barbed_7tv = { package = "barbed-7tv", path = "barbed-7tv", version = "0.0.4-alpha", default-features = false }
barbed_bttv = { package = "barbed-bttv", path = "barbed-bttv", version = "0.0.4-alpha", default-features = false }
barbed_ffz = { package = "barbed-ffz", path = "barbed-ffz", version = "0.0.4-alpha", default-features = false }

async-trait = "0.1"
base64 = "0.22"
bitflags = { version = "2", features = ["serde"] }
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "form", "query"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1", features = ["full", "tracing"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["rustls-tls-native-roots", "connect"] }
tracing = "0.1"

[package]
name = "barbed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Twitch Helix, EventSub, OAuth, IRC, and provider helpers"
readme = false
repository.workspace = true
documentation.workspace = true
keywords = ["twitch", "eventsub", "helix", "oauth"]

[dependencies]
anyhow = { version = "1", optional = true }
async-trait.workspace = true
base64.workspace = true
barbed-core.workspace = true
barbed_7tv = { workspace = true, optional = true }
barbed_bttv = { workspace = true, optional = true }
barbed_ffz = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
hex.workspace = true
hmac.workspace = true
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

# Optional: Cloudflare Workers integration
wasm-bindgen = { version = "0.2", optional = true }
worker = { version = "0.8", optional = true }

[features]
cloudflare-worker = ["dep:worker", "dep:wasm-bindgen"]
reqwest-client = ["dep:anyhow", "dep:reqwest", "dep:tokio", "dep:tracing"]
tokio-eventsub = [
    "reqwest-client",
    "dep:futures-util",
    "dep:rustls",
    "dep:tokio-tungstenite",
]
tokio-irc = ["dep:tokio"]
seventv = ["dep:barbed_7tv"]
seventv-reqwest = ["seventv", "barbed_7tv/reqwest-client"]
bttv = ["dep:barbed_bttv"]
bttv-reqwest = ["bttv", "barbed_bttv/reqwest-client"]
ffz = ["dep:barbed_ffz"]
ffz-reqwest = ["ffz", "barbed_ffz/reqwest-client"]

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
tokio.workspace = true
